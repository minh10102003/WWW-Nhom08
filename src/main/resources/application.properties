# 1. CẤU HÌNH DATABASE (MARIADB)
spring.datasource.url=jdbc:mariadb://localhost:3306/iphone_shop?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# 2. CẤU HÌNH JPA / HIBERNATE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# 3. CẤU HÌNH WEB
server.servlet.context-path=/iphoneshop
server.error.whitelabel.enabled=false

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp
spring.web.resources.add-mappings=false

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# 4. FILE UPLOAD

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


# 5. CẤU HÌNH EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=admin@gmail.com
spring.mail.password=123456
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Chỉ hiện log INFO trở lên, tắt log DEBUG rác
logging.level.root=INFO
logging.level.org.springframework.boot.autoconfigure=INFO